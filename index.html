<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <link rel="stylesheet" type="text/css" href="css/game.css">
        <title>Heaven For Death</title>
    </head>
    <body style="background-color: black">
        <!-- RPGMaker scripts -->
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

        <!-- Languages -->
        <div id="language-selector" class="lang-overlay">
            <div class="lang-box">
                <h2>语言 / 言語 / Language / Idioma / язык / linguagem</h2>
                <div class="lang-buttons">
                    <button onclick="selectLanguage('cn')" class="img-button">
                        <img src="img/system/lang_cn.png" alt="简体中文">
                    </button>
                    <button onclick="selectLanguage('jp')" class="img-button">
                        <img src="img/system/lang_jp.png" alt="日本語">
                    </button>
                    <button onclick="selectLanguage('en')" class="img-button">
                        <img src="img/system/lang_en.png" alt="English">
                    </button>
                    <button onclick="selectLanguage('es')" class="img-button">
                        <img src="img/system/lang_es.png" alt="Español">
                    </button>
                    <button onclick="selectLanguage('ru')" class="img-button">
                        <img src="img/system/lang_ru.png" alt="Русский">
                    </button>
                    <button onclick="selectLanguage('pt')" class="img-button">
                        <img src="img/system/lang_pt.png" alt="Português">
                    </button>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div id="credits">
            <a href="https://yiminghack.itch.io/heaven-for-death" target="_blank" class="img-button">
                <img src="img/system/btn_itch.png" alt="Download from itch.io">
            </a>

            <a href="https://github.com/YmdRyo/heavenfordeath" target="_blank" class="img-button">
                <img src="img/system/btn_github.png" alt="GitHub">
            </a>
        </div>

        <div id="fullscreen-btn">
            <button onclick="toggleFullScreen()" class="img-button">
                <img src="img/system/btn_fullscreen.png" alt="Pantalla Completa">
            </button>
        </div>

        <!-- Fullscreen -->
        <script type="text/javascript">
            function toggleFullScreen() {
                var element = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (element.requestFullscreen) {
                        element.requestFullscreen();
                    } else if (element.webkitRequestFullscreen) {
                        element.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }

                setTimeout(function() {
                    if (typeof Graphics !== 'undefined' && Graphics._updateAllElements) {
                        Graphics._updateAllElements();
                    }
                }, 100);
            }
        </script>

        <!-- Language -->
        <script type="text/javascript">
            window.currentLanguage = '';

            function selectLanguage(lang) {
                window.currentLanguage = lang;

                var fontFile = "TT_Pearl-L.ttf";

                if (lang === 'en') {
                    fontFile = "TT_Pearl-L.ttf";
                } else if (lang === 'pt') {
                    fontFile = "TT_Pearl-L.ttf";
                } else if (lang === 'es') {
                    fontFile = "TT_Pearl-L.ttf";
                } else if (lang === 'ru') {
                    fontFile = "MazardM-Light.ttf";
                } else if (lang === 'cn') {
                    fontFile = "24.ttf";
                } else if (lang === 'jp') {
                    fontFile = "TT_Pearl-L.woff";
                }

                var dynamicStyle = document.getElementById('dynamic-font-style');
                if (!dynamicStyle) {
                    dynamicStyle = document.createElement('style');
                    dynamicStyle.id = 'dynamic-font-style';
                    document.head.appendChild(dynamicStyle);
                }
                
                dynamicStyle.innerHTML = `
                    @font-face {
                        font-family: GameFont;
                        src: url('fonts/${fontFile}');
                    }
                `;

                document.getElementById('language-selector').style.display = 'none';

                if (typeof DataManager !== 'undefined' && DataManager.loadDatabase) {
                    DataManager.loadDatabase();
                }
            }
        </script>
    </body>
</html>
